[general]
renice=10
softrealtime=auto
inhibit_screensaver=1
desiredgov=performance
defaultgov=powersave
desiredprof=performance
defaultprof=balance_performance

[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=@CARD@
amd_performance_level=high

[custom]
start=notify-send -a gamemode -t 2000 "GameMode" "performance"
end=notify-send -a gamemode -t 2000 "GameMode" "back to normal"

[terminal]
vt = "next"

[default_session]
# regreet is a GTK application, so it needs a compositor of its own. cage
# gives it a single full-screen surface and nothing else.
#
# The previous tuigreet line is kept below; if regreet ever fails to start,
# swap the two `command` values from a TTY and greetd works again.
command = "cage -s -mlast -- regreet"
user = "greeter"

# Previous configuration, kept as a fallback:
# command = "tuigreet --time --time-format '%H:%M  %d.%m.%Y' --greeting 'Hy!' --cmd 'dbus-run-session start-hyprland' --sessions /usr/share/wayland-sessions --remember-session --asterisks --width 60 --theme 'border=#cba6f7;text=#cdd6f4;prompt=#89b4fa;time=#a6e3a1;action=#cba6f7;container=#1e1e2e;input=#cdd6f4'"

# Generated by matugen — follows the wallpaper together with the rest of the shell.

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

hovered         = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
preview_hovered = { underline = true }

find_keyword  = { fg = "{{colors.tertiary.default.hex}}", italic = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bg = "reset", italic = true }

marker_copied   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

count_copied   = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
count_cut      = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

border_symbol = "│"
border_style  = { fg = "{{colors.outline.default.hex}}" }

syntect_theme = ""

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[mode]
normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
select = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
unset  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }

[status]
overall   = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface.default.hex}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[which]
cols = 3
mask            = { bg = "{{colors.surface_container.default.hex}}" }
cand            = { fg = "{{colors.primary.default.hex}}" }
rest            = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc            = { fg = "{{colors.on_surface.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[confirm]
border     = { fg = "{{colors.primary.default.hex}}" }
title      = { fg = "{{colors.primary.default.hex}}" }
content    = {}
list       = {}
btn_yes    = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no     = {}
btn_labels = [ "  Yes  ", "  (N)o  " ]

[spot]
border = { fg = "{{colors.primary.default.hex}}" }
title  = { fg = "{{colors.primary.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.tertiary.default.hex}}" }
title_warn  = { fg = "{{colors.secondary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.secondary.default.hex}}", bold = true }
inactive = {}

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.secondary.default.hex}}", bold = true }
inactive = {}

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = {}
hovered = { fg = "{{colors.secondary.default.hex}}", underline = true }

[help]
on      = { fg = "{{colors.primary.default.hex}}" }
run     = { fg = "{{colors.secondary.default.hex}}" }
desc    = { fg = "{{colors.on_surface_variant.default.hex}}" }
hovered = { bg = "{{colors.surface_variant.default.hex}}", bold = true }
footer  = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface.default.hex}}" }

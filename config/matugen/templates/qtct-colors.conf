; QPalette in the wallpaper's colours, for qt5ct/qt6ct.
;
; Twenty-one roles in QPalette order, no names, comma separated:
;   WindowText Button Light Midlight Dark Mid Text BrightText ButtonText Base
;   Window Shadow Highlight HighlightedText Link LinkVisited AlternateBase
;   NoRole ToolTipBase ToolTipText PlaceholderText
;
; Kvantum sets its own palette from its theme, so this matters most when a Qt
; app falls back to Fusion — but both are generated from the same source, so
; whichever wins, the colours agree.

[ColorScheme]
active_colors=#ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.surface_container_highest.default.hex_stripped}}, #ff{{colors.surface_variant.default.hex_stripped}}, #ff{{colors.surface_container_lowest.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.shadow.default.hex_stripped}}, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.on_primary.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #80{{colors.on_surface_variant.default.hex_stripped}}
disabled_colors=#ff{{colors.outline.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.surface_container_highest.default.hex_stripped}}, #ff{{colors.surface_variant.default.hex_stripped}}, #ff{{colors.surface_container_lowest.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.shadow.default.hex_stripped}}, #ff{{colors.surface_variant.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #80{{colors.outline.default.hex_stripped}}
inactive_colors=#ff{{colors.on_surface_variant.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.surface_container_highest.default.hex_stripped}}, #ff{{colors.surface_variant.default.hex_stripped}}, #ff{{colors.surface_container_lowest.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.on_surface_variant.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.shadow.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #80{{colors.on_surface_variant.default.hex_stripped}}

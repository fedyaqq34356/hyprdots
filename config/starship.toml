format = """
$directory$git_branch$git_status${custom.venv}$nix_shell
$character"""

add_newline = false

[directory]
style             = "bold cyan"
format            = "[$path]($style)"
truncation_length  = 3
truncate_to_repo   = true
home_symbol        = ""
repo_root_style   = "bold cyan"
repo_root_format  = "[$repo_root]($repo_root_style)[$path]($style)"

[git_branch]
symbol = ""
style  = "bold magenta"
format = " [$branch]($style)"

# статус репозитория символами, не словами
[git_status]
disabled   = false
style      = "bold yellow"
format     = " [$all_status$ahead_behind]($style)"
conflicted = "="
ahead      = "↑${count}"
behind     = "↓${count}"
diverged   = "↕↑${ahead_count}↓${behind_count}"
up_to_date = ""
untracked  = "?${count}"
stashed    = "$"
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

# активная venv — цветная точка, без имени интерпретатора
[python]
disabled = true

[custom.venv]
description = "точка, когда активна virtualenv"
when         = "test -n \"$VIRTUAL_ENV\""
command      = "echo ●"
style        = "bold green"
format       = " [$output]($style)"
shell        = ["sh"]

# nix-shell / nix develop — точка другого цвета
[nix_shell]
disabled     = false
symbol       = ""
style        = "bold blue"
format       = " [●]($style)"
heuristic    = true

[character]
success_symbol = "[>](bold green)"
error_symbol   = "[>](bold red)"
vimcmd_symbol  = "[<](bold cyan)"

[cmd_duration]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = true
[package]
disabled = true
[battery]
disabled = true
[time]
disabled = true
[os]
disabled = true

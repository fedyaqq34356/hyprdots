; Общий qt5ct/qt6ct для чёрного режима. serezha-mode кладёт этот файл на
; место ~/.config/qt6ct/qt6ct.conf и ~/.config/qt5ct/qt5ct.conf, а старые
; сохраняет рядом с суффиксом .pre-serezha.
;
; style=Fusion, а не kvantum: Kvantum — отдельный движок, который на каждое
; Qt-приложение поднимает парсер SVG-темы и держит распакованные элементы
; рамок в памяти. Fusion встроен в Qt и рисует примитивами.
;
; Секция [Fonts] намеренно отсутствует: qt6ct хранит шрифт бинарным QVariant,
; и написанный руками блоб он читает как испорченный. Без секции берётся
; системный шрифт.

[Appearance]
color_scheme_path=/home/f/.config/serezha/qt/black.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=default
style=Fusion

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
; Мигающий курсор ввода — таймер на 2 Гц в каждом Qt-окне с полем ввода.
cursor_flash_time=0
dialog_buttons_have_icons=0
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=false
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=2
underline_shortcut=1
wheel_scroll_lines=3

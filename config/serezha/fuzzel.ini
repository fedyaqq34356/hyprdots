[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=no
prompt=": "
icons-enabled=no
image-size-ratio=0
fields=name,generic,exec
terminal=kitty -e
launch-prefix=/home/f/.local/bin/serezha-env
lines=12
width=45
horizontal-pad=12
vertical-pad=8
inner-pad=4
line-height=18
tabs=4
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=000000ff
text=b0b0b0ff
prompt=606060ff
placeholder=404040ff
input=ffffffff
match=ffffffff
selection=1a1a1aff
selection-text=ffffffff
selection-match=ffffffff
counter=404040ff
border=000000ff

[border]
width=0
radius=0

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+c Control+bracketleft

font=JetBrainsMono Nerd Font:size=11
dpi-aware=no
pad=8x8
initial-window-size-chars=100x28
term=foot

[scrollback]
lines=1000
multiplier=3

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[csd]
preferred=none

[bell]
urgent=no
notify=no

[tweak]
sixel=no

max-shm-pool-size-mb=32

[colors-dark]
alpha=1.0
background=000000
foreground=b0b0b0
cursor=000000 ffffff

regular0=1a1a1a
regular1=ff5555
regular2=8fbf7f
regular3=d0b070
regular4=7f9fbf
regular5=a98fbf
regular6=7fbfbf
regular7=b0b0b0

bright0=404040
bright1=ff7070
bright2=a5d495
bright3=e5c585
bright4=95b5d4
bright5=bfa5d4
bright6=95d4d4
bright7=ffffff

selection-foreground=ffffff
selection-background=303030

[colors-light]
alpha=1.0
background=000000
foreground=b0b0b0
cursor=000000 ffffff

regular0=1a1a1a
regular1=ff5555
regular2=8fbf7f
regular3=d0b070
regular4=7f9fbf
regular5=a98fbf
regular6=7fbfbf
regular7=b0b0b0

bright0=404040
bright1=ff7070
bright2=a5d495
bright3=e5c585
bright4=95b5d4
bright5=bfa5d4
bright6=95d4d4
bright7=ffffff

selection-foreground=ffffff
selection-background=303030

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*PlayStation.*Link.*" }
      { node.name = "~alsa_input.*PlayStation.*Link.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver = 2500
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

general {
    lock_cmd       = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 50 minutes without input: lock, unless idle-guard finds a reason not to.
listener {
    timeout     = 3000
    on-timeout  = ~/.config/hypr/scripts/idle-guard.sh lock
}

# 55 minutes: turn the panels off as well.
listener {
    timeout     = 3300
    on-timeout  = ~/.config/hypr/scripts/idle-guard.sh dpms-off
    on-resume   = hyprctl dispatch dpms on
}

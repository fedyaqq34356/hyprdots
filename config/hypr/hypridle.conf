general {
    lock_cmd       = pidof hyprlock || ~/.config/hypr/scripts/lock/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprdo dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout     = 180
    on-timeout  = ~/.config/hypr/scripts/system/eco-dpms.sh
    on-resume   = hyprdo dispatch dpms on
}

listener {
    timeout     = 300
    on-timeout  = ~/.config/hypr/scripts/system/eco-suspend.sh start
    on-resume   = ~/.config/hypr/scripts/system/eco-suspend.sh stop
}

listener {
    timeout     = 3000
    on-timeout  = ~/.config/hypr/scripts/lock/idle-guard.sh lock
}

listener {
    timeout     = 3300
    on-timeout  = ~/.config/hypr/scripts/lock/idle-guard.sh dpms-off
    on-resume   = hyprdo dispatch dpms on
}

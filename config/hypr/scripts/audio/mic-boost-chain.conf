context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
      args = { }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Mic BOOST"
        media.name       = "Mic BOOST"
        filter.graph = {
          nodes = [
            { type = ladspa name = comp plugin = sc4m_1916 label = sc4m
              control = {
                "RMS/peak"             = 1.0
                "Attack time (ms)"     = 1.5
                "Release time (ms)"    = 40.0
                "Threshold level (dB)" = -30.0
                "Ratio (1:n)"          = 20.0
                "Knee radius (dB)"     = 10.0
                "Makeup gain (dB)"     = 24.0
              }
            }
            { type = builtin name = pre label = linear control = { "Mult" = 300.0 "Add" = 0.0 } }
            { type = builtin name = clip1 label = clamp control = { "Min" = -1.0 "Max" = 1.0 } }
            { type = ladspa name = fuzz plugin = foverdrive_1196 label = foverdrive control = { "Drive level" = 3.0 } }
            { type = builtin name = bass label = bq_lowshelf control = { "Freq" = 180.0 "Q" = 0.7 "Gain" = 15.0 } }
            { type = builtin name = harsh label = bq_peaking control = { "Freq" = 3000.0 "Q" = 0.7 "Gain" = 15.0 } }
            { type = builtin name = post label = linear control = { "Mult" = 20.0 "Add" = 0.0 } }
            { type = builtin name = clip2 label = clamp control = { "Min" = -1.0 "Max" = 1.0 } }
            { type = ladspa name = crush plugin = decimator_1202 label = decimator control = { "Bit depth" = 4.0 "Sample rate (Hz)" = 6000.0 } }
            { type = builtin name = clip label = clamp control = { "Min" = -0.99 "Max" = 0.99 } }
          ]
          links = [
            { output = "comp:Output" input = "pre:In" }
            { output = "pre:Out" input = "clip1:In" }
            { output = "clip1:Out" input = "fuzz:Input" }
            { output = "fuzz:Output" input = "bass:In" }
            { output = "bass:Out" input = "harsh:In" }
            { output = "harsh:Out" input = "post:In" }
            { output = "post:Out" input = "clip2:In" }
            { output = "clip2:Out" input = "crush:Input" }
            { output = "crush:Output" input = "clip:In" }
          ]
          inputs  = [ "comp:Input" ]
          outputs = [ "clip:Out" ]
        }
        capture.props = {
          node.name      = "mic_boost_capture"
          audio.position = [ MONO ]
          target.object  = "alsa_input.usb-3142_FIFINE_Microphone-00.mono-fallback"
          node.passive   = true
          stream.dont-remix = true
        }
        playback.props = {
          node.name        = "mic_boost"
          node.description = "Mic BOOST"
          media.class      = Audio/Source
          audio.position   = [ MONO ]
        }
      }
    }
]

source = ~/.config/hypr/config/env.conf
source = ~/.config/hypr/config/monitors.conf
source = ~/.config/hypr/config/animations.conf
source = ~/.config/hypr/config/binds.conf
source = ~/.config/hypr/config/rules.conf
source = ~/.config/hypr/config/startup.conf
source = ~/.config/hypr/config/colors.conf

general {
    gaps_in  = 4
    gaps_out = 8
    border_size = 2
    col.active_border   = $active_border_1 $active_border_2 45deg
    col.inactive_border = $inactive_border
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12

    active_opacity   = 1.0
    inactive_opacity = 0.94

    dim_inactive = true
    dim_strength = 0.08
    dim_special  = 0.25

    blur {
        enabled    = true
        size       = 8
        passes     = 3
        xray              = true
        ignore_opacity    = true
        new_optimizations = true
        noise      = 0.015
        contrast   = 1.10
        brightness = 1.00
        vibrancy   = 0.20
        vibrancy_darkness = 0.50
        popups            = true
        popups_ignorealpha = 0.40
    }

    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        offset       = 0 4
        color        = $shadow
        color_inactive = $shadow_inactive
    }
}

input {
    kb_layout  = us,ru
    kb_variant = ,
    kb_options = grp:alt_shift_toggle

    follow_mouse   = 1
    sensitivity    = 0.3
    repeat_rate    = 30
    repeat_delay   = 300

    touchpad {
        natural_scroll       = true
        tap-to-click         = true
        drag_lock            = true
        disable_while_typing = true
        scroll_factor        = 0.5
    }
}

gesture = 3, horizontal, workspace

dwindle {
    preserve_split = true
    smart_split    = false
    smart_resizing = true
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    vrr              = 0
    focus_on_activate = false
}

xwayland {
    enabled = true
}

source = ~/.config/hypr/config/lock-colors.conf

general {
    hide_cursor = true
    fail_timeout = 1600
    ignore_empty_input = true
    text_trim = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.3, 1
    animation = fade, 1, 5, smooth
    animation = inputFieldColors, 1, 3, smooth
    animation = inputFieldWidth, 1, 4, smooth
    animation = inputFieldDots, 1, 3, smooth
}

background {
    monitor =
    path = $wallpaper
    blur_size = 6
    blur_passes = 3
    noise = 0.011
    brightness = 0.42
    contrast = 1.05
    vibrancy = 0.22
    vibrancy_darkness = 0.35
}

shape {
    monitor =
    size = 430, 430
    color = $surface
    rounding = 34
    border_size = 1
    border_color = $outline
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_boost = 1.4
    shadow_color = $shadow
}

shape {
    monitor =
    size = 74, 74
    color = $surface_glass
    rounding = 37
    border_size = 1
    border_color = $outline
    position = 0, 152
    halign = center
    valign = center
}

label {
    monitor =
    text =
    color = $primary
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, 152
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 68
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 58
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:30000] date +"%A, %d %B"
    color = $on_surface_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 8
    halign = center
    valign = center
}

shape {
    monitor =
    size = 120, 1
    color = $outline
    rounding = 0
    position = 0, -22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    outer_color = $outline
    inner_color = $surface_glass
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    capslock_color = $secondary
    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    rounding = 25
    fade_on_empty = false
    placeholder_text = $placeholder
    fail_text = <i>$FAIL</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:0] echo "  $USER@$(hostname -s)"
    color = $on_surface_dim
    font_size = 13
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $on_surface_faint
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-status.sh uptime
    color = $on_surface_faint
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 34, 28
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-status.sh power
    color = $on_surface_faint
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -34, 28
    halign = right
    valign = bottom
}

windowrule = float on, match:class ^(org.kde.dolphin)$, match:title ^(Progress Dialog)$
windowrule = float on, match:class ^(org.kde.dolphin)$, match:title ^(Copying)$
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float on, match:class ^(hyprpolkitagent)$
windowrule = center on, match:class ^(hyprpolkitagent)$

windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on,   match:title ^(Picture-in-Picture)$

layerrule = blur on, match:namespace waybar
layerrule = blur on, ignore_alpha 0.8, match:namespace rofi

windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$

windowrule = float on,        match:class ^(kitty-scratch)$
windowrule = size 70% 65%,    match:class ^(kitty-scratch)$
windowrule = center on,       match:class ^(kitty-scratch)$
windowrule = animation slide, match:class ^(kitty-scratch)$

layerrule = blur on,            match:namespace ^(qs-bar)$
layerrule = ignore_alpha 0.55,  match:namespace ^(qs-bar)$

layerrule = blur on,            match:namespace ^(qs-notifications|qs-osd)$
layerrule = ignore_alpha 0.45,  match:namespace ^(qs-notifications|qs-osd)$

layerrule = blur on,            match:namespace ^(qs-launcher|qs-clipboard|qs-wallpapers|qs-audio|qs-power|qs-wifi)$
layerrule = ignore_alpha 0.60,  match:namespace ^(qs-launcher|qs-clipboard|qs-wallpapers|qs-audio|qs-power|qs-wifi)$

layerrule = blur on,            match:namespace ^(qs-overview)$
layerrule = ignore_alpha 0.50,  match:namespace ^(qs-overview)$

layerrule = animation none, match:namespace ^(qs-flash)$

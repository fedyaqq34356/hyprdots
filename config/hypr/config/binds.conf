$mainMod = SUPER

bind = $mainMod,       Return, exec, kitty
bind = $mainMod,       D,      global, quickshell:launcher
bind = $mainMod,       E,      exec, thunar
bind = $mainMod,       W,      global, quickshell:wallpapers
bind = $mainMod,       V,      global, quickshell:clipboard

bind = $mainMod,       Q,      killactive
bind = ALT,            F4,     killactive
bind = $mainMod,       F,      fullscreen, 0
bind = $mainMod SHIFT, F,      togglefloating

bind = $mainMod,       H, movefocus, l
bind = $mainMod,       L, movefocus, r
bind = $mainMod,       K, movefocus, u
bind = $mainMod,       J, movefocus, d

bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/lock.sh

binde = $mainMod,       right, moveactive,   30 0
binde = $mainMod,       left,  moveactive,  -30 0
binde = $mainMod,       up,    moveactive,   0 -30
binde = $mainMod,       down,  moveactive,   0 30
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, left,  resizeactive, -50 0
binde = $mainMod SHIFT, up,    resizeactive, 0 -50
binde = $mainMod SHIFT, down,  resizeactive, 0 50

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod,       1, workspace, 1
bind = $mainMod,       2, workspace, 2
bind = $mainMod,       3, workspace, 3
bind = $mainMod,       4, workspace, 4
bind = $mainMod,       5, workspace, 5
bind = $mainMod,       6, workspace, 6
bind = $mainMod,       7, workspace, 7
bind = $mainMod,       8, workspace, 8
bind = $mainMod,       9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, P, exec, wlogout -b 3 -l ~/.config/wlogout/layout -C ~/.config/wlogout/style.css

bind = ,      Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/record-toggle.sh

bindel = , XF86AudioRaiseVolume,  global, quickshell:volumeUp
bindel = , XF86AudioLowerVolume,  global, quickshell:volumeDown
bindl  = , XF86AudioMute,         global, quickshell:volumeMute
bindl  = , XF86AudioMicMute,      global, quickshell:micMute

bindel = $mainMod, equal,  global, quickshell:volumeUp
bindel = $mainMod, minus,  global, quickshell:volumeDown
bind   = $mainMod, M,      global, quickshell:micMute
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mainMod SHIFT, F3, exec, kitty --title "clean-cache" sh -c "~/.config/hypr/scripts/clean-cache.sh"
bind = $mainMod SHIFT, F4, exec, kitty --title "update-packages" sh -c "~/.config/hypr/scripts/update-packages.sh"

bind = $mainMod, T, exec, ~/.config/hypr/scripts/scratch-term.sh

bind = $mainMod SHIFT, E, exit
bind = $mainMod SHIFT, R, exec, hyprctl reload

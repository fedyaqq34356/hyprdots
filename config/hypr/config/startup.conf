exec-once = ~/.config/hypr/scripts/system/monitor-flicker-fix.py

exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = brightnessctl -c backlight set 70% 2>/dev/null
exec-once = hyprpolkitagent
exec-once = udiskie --no-tray --automount --notify
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = ~/.config/hypr/scripts/audio/start-wireplumber.sh
exec-once = ~/.config/hypr/scripts/notify/notify-trace.sh
exec-once = ~/.config/hypr/scripts/notify/notif-missed.sh
exec-once = ~/.local/bin/shell-autostart
exec-once = ~/.config/hypr/scripts/system/fix-dbus.sh

exec-once = awww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper/startup-wallpaper.sh
exec-once = ~/.config/hypr/scripts/wallpaper/wallpaper-rotate.sh
exec-once = xdg-user-dirs-update
exec-once = wl-paste --type text --watch ~/.config/hypr/scripts/clipboard/cliphist-store.sh
exec-once = wl-paste --type image --watch cliphist -max-items 150 store
exec-once = wl-clip-persist --clipboard regular -f '^([^i]|i[^m]|im[^a]|ima[^g]|imag[^e]|image[^/])'
exec-once = ~/.config/hypr/scripts/clipboard/clipboard-guard.sh
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR HYPRLAND_INSTANCE_SIGNATURE

exec-once = ~/.config/hypr/scripts/audio/mic-lock.sh

exec-once = ~/.config/hypr/scripts/tools/downloads-sort.py

exec-once = hyprctl setcursor Matugen-Cursor 24

general {
    gaps_in  = 0
    gaps_out = 0
    border_size = 1
    col.active_border   = rgba(ffffffff)
    col.inactive_border = rgba(000000ff)
    resize_on_border = true
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.0
    dim_special  = 0.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    background_color = rgb(000000)
    force_default_wallpaper = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    vrr = 0
    focus_on_activate = false
    disable_autoreload = true
}

render {
    direct_scanout = true

    cm_enabled = false

    expand_undersized_textures = false
}

opengl {
    nvidia_anti_flicker = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

cursor {
    no_hardware_cursors = false
    inactive_timeout = 5
    hide_on_key_press = true
}

unbind = $mainMod, D
unbind = $mainMod, Tab
unbind = $mainMod, W
unbind = $mainMod, N
unbind = $mainMod, V
unbind = $mainMod, A
unbind = $mainMod SHIFT, D
unbind = $mainMod, F1
unbind = $mainMod SHIFT, N
unbind = $mainMod CTRL, N
unbind = $mainMod, B
unbind = $mainMod, C
unbind = $mainMod SHIFT, B
unbind = $mainMod SHIFT, P
unbind = $mainMod SHIFT, W
unbind = $mainMod SHIFT, G
unbind = $mainMod SHIFT, A
unbind = $mainMod SHIFT, J
unbind = $mainMod SHIFT, Q
unbind = $mainMod CTRL, T
unbind = $mainMod ALT, T
unbind = $mainMod, M
unbind = $mainMod SHIFT, M
unbind = $mainMod SHIFT, L

unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86AudioMicMute
unbind = , XF86AudioPlay
unbind = , XF86AudioPause
unbind = , XF86AudioNext
unbind = , XF86AudioPrev
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
unbind = $mainMod, equal
unbind = $mainMod, minus
unbind = $mainMod SHIFT, equal
unbind = $mainMod SHIFT, minus

bind = $mainMod, D, exec, fuzzel --config=$HOME/.config/serezha/fuzzel.ini

bind = $mainMod, V, exec, $HOME/.local/bin/serezha-clip

bind = $mainMod SHIFT, P, exec, $HOME/.local/bin/serezha-menu

$serezhaTerm = foot -c $HOME/.config/serezha/foot/foot.ini
unbind = $mainMod, Return
bind = $mainMod, Return, exec, $serezhaTerm

unbind = $mainMod, E
unbind = $mainMod SHIFT, Y
bind = $mainMod, E, exec, $HOME/.local/bin/serezha-files

bind = $mainMod, N, exec, $serezhaTerm --app-id serezha-tui -e nmtui
bind = $mainMod, B, exec, $serezhaTerm --app-id serezha-tui -e bluetoothctl

bind = $mainMod SHIFT, M, exec, $HOME/.local/bin/serezha-menu audio

bind = $mainMod SHIFT, L, exec, hyprlock -c $HOME/.config/serezha/hyprlock.conf

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = $mainMod, equal,         exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, minus,         exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind   = $mainMod, M,             exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = $mainMod SHIFT, equal,   exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%+
bindel = $mainMod SHIFT, minus,   exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-

bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

bindel = , XF86MonBrightnessUp,   exec, brightnessctl -c backlight set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -c backlight set 5%-

bind = $mainMod SHIFT, N, exec, makoctl restore
bind = $mainMod CTRL,  N, exec, $HOME/.local/bin/serezha-dnd

windowrule = float on,       match:class ^(serezha-tui)$
windowrule = size 900 600,   match:class ^(serezha-tui)$
windowrule = center on,      match:class ^(serezha-tui)$

windowrule = float on,       match:class ^(serezha-files)$
windowrule = size 1000 640,  match:class ^(serezha-files)$
windowrule = center on,      match:class ^(serezha-files)$
